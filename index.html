<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixi + Matter Physics Demo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.13.0/pixi.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
            color: white;
        }

        #gameContainer {
            position: relative;
            width: 980px;
            height: 640px;
            margin: 0 auto;
            border: 2px solid #16213e;
        }

        #debugCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .controls {
            text-align: center;
            margin: 20px 0;
        }

        button {
            background: #0f3460;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }

        button:hover {
            background: #16213e;
        }

        button.active {
            background: #e94560;
        }
    </style>
</head>

<body>
    <div class="controls">
        <button id="debugBtn">Toggle Debug (D)</button>
        <button id="spawnBtn">Spawn Random Object (Space)</button>
        <button id="resetBtn">Reset Scene (R)</button>
    </div>
    <div id="gameContainer"></div>

    <script type="module">
        const GAME_WIDTH = 980;
        const GAME_HEIGHT = 640;
        const MAX_VELOCITY_X = 10;
        const { Engine, Render, Body, Bodies, World, Events, Composites } = Matter;

        let input = { xDirection: null, yDirection: null }
        let pointerDown = false

        const app = new PIXI.Application()
        await app.init({
            width: GAME_WIDTH,
            height: GAME_HEIGHT,
            backgroundColor: 0x0f3460,
            antialias: true
        });
        document.getElementById('gameContainer').appendChild(app.canvas);

        const engine = Engine.create();
        engine.gravity.y = 1;

        const debugCanvas = document.createElement('canvas');
        debugCanvas.id = 'debugCanvas';
        debugCanvas.width = GAME_WIDTH;
        debugCanvas.height = GAME_HEIGHT;
        document.getElementById('gameContainer').appendChild(debugCanvas);

        const debugRender = Render.create({
            canvas: debugCanvas,
            engine: engine,
            options: {
                width: GAME_WIDTH,
                height: GAME_HEIGHT,
                wireframes: true,
                background: 'transparent',
                wireframeBackground: 'transparent'
            }
        });

        async function loadTexture(name) {
            const path = "public/img/" + name + ".png";
            const texture = await PIXI.Assets.load(path);
            texture.baseTexture.scaleMode = PIXI.SCALE_MODES.NEAREST;
            return texture;
        }

        let debugMode = true;

        const objects = [];
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        let currentLetterIndex = 0;

        const ground = Bodies.rectangle(5000, 580, 10000, 40, {
            isStatic: true,
            friction: 0.5,
            restitution: 0.3
        });
        World.add(engine.world, ground);

        const groundSprite = new PIXI.Graphics();
        groundSprite.beginFill(0x16213e);
        groundSprite.drawRect(0, 560, GAME_WIDTH, 40);
        groundSprite.endFill();
        app.stage.addChild(groundSprite);

        const leftWall = Bodies.rectangle(0, 300, 40, GAME_HEIGHT, { isStatic: true });
        const rightWall = Bodies.rectangle(2000, 300, 40, GAME_HEIGHT, { isStatic: true });
        World.add(engine.world, [leftWall, rightWall]);

        function createLetter(x, y, letter) {
            const size = 80;
            const body = Bodies.rectangle(x, y, size, size, {
                restitution: 0.6,
                friction: 0.5
            });

            const container = new PIXI.Container();

            const bg = new PIXI.Graphics();
            const colors = [0xE81416,
                0xFFA500,
                0xFAEB36,
                0x79C314,
                0x487DE7,
                0x4B369D,
                0x70369D];
            const color = colors[Math.floor(Math.random() * colors.length)]

            bg.beginFill(color);
            bg.drawRoundedRect(-size / 2, -size / 2, size, size, 8);
            bg.endFill();
            container.addChild(bg);

            const text = new PIXI.Text(letter, {
                fontFamily: 'Arial',
                fontSize: 32,
                fontWeight: 'bold',
                fill: 0xFFFFFF,
                align: 'center',
                dropShadow: true,
            });
            text.anchor.set(0.5);
            container.addChild(text);

            app.stage.addChild(container);
            World.add(engine.world, body);

            objects.push({ body, sprite: container });
        }

        function spawnRandomObject() {
            const x = 200 + Math.random() * 400;
            const y = 50;
            const letter = alphabet[currentLetterIndex];
            createLetter(x, y, letter);
            currentLetterIndex = (currentLetterIndex + 1) % alphabet.length;
        }

        let car;

        function initScene() {
            const background = new PIXI.Container();
            const backgroundRect = new PIXI.Graphics().rect(0, 0, GAME_WIDTH, GAME_HEIGHT).fill(0x2222aa);
            background.addChild(backgroundRect);
            app.stage.addChild(background);
            car = Composites.car(350, 300, 150, 30, 30);
            World.add(engine.world, car);
        }
        function resetScene() {
            objects.forEach(obj => {
                World.remove(engine.world, obj.body);
                app.stage.removeChild(obj.sprite);
            });
            objects.length = 0;
            initScene();
        }
        function toggleDebug() {
            debugMode = !debugMode;
            debugCanvas.style.display = debugMode ? 'block' : 'none';
            document.getElementById('debugBtn').classList.toggle('active', debugMode);
        }

        app.ticker.add(() => {
            Engine.update(engine, 1000 / 60);

            objects.forEach(obj => {
                obj.sprite.x = obj.body.position.x;
                obj.sprite.y = obj.body.position.y;
                obj.sprite.rotation = obj.body.angle;
            });

            if (input.xDirection !== null || input.yDirection !== null) {
                moveCar(input.xDirection, input.yDirection)
            }

            if (debugMode) {
                Render.world(debugRender);
            }
        });

        function moveCar(xDirection, yDirection) {
            console.log(xDirection, yDirection)
            let forceX = 0, forceY = 0
            if (xDirection === "left") { forceX = -1; }
            if (xDirection === "right") { forceX = 1; }
            if (xDirection === "up") { forceY = -1; }
            if (xDirection === "down") { forceY = 0; }

            if (Math.abs(car.bodies[0].velocity.x) < MAX_VELOCITY_X) {
                Body.applyForce(car.bodies[0], car.bodies[0].position, { x: forceX * 0.01, y: forceY * 0.2 })
            }
        }

        async function onPointerEvent(e) {
            if (pointerDown) {
                const pos = e.getLocalPosition(app.stage)
                const xDirection = pos.x > app.stage.width / 2 ? "right" : "left"
                const yDirection = pos.y < app.stage.height / 2 ? "up" : "down"
                input = { xDirection, yDirection }
            }
        }

        app.stage.eventMode = 'static'
        app.stage.on('pointerdown', async (e) => {
            pointerDown = true
        })
        app.stage.on('pointerup', async (e) => {
            pointerDown = false
            input = { xDirection: null, yDirection: null }
        })
        app.stage.on('pointermove', onPointerEvent)

        document.getElementById('debugBtn').addEventListener('click', toggleDebug);
        document.getElementById('spawnBtn').addEventListener('click', spawnRandomObject);
        document.getElementById('resetBtn').addEventListener('click', resetScene);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'd' || e.key === 'D') {
                toggleDebug();
            } else if (e.key === ' ') {
                e.preventDefault();
                spawnRandomObject();
            } else if (e.key === 'r' || e.key === 'R') {
                resetScene();
            } else if (e.key === 'ArrowRight') {
                input.xDirection = "right"
            } else if (e.key === 'ArrowLeft') {
                input.xDirection = "left"
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowRight') {
                input.xDirection = null
            } else if (e.key === 'ArrowLeft') {
                input.xDirection = null
            }
        });

        initScene();
    </script>
</body>

</html>
