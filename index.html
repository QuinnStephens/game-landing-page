        // A cut-out piece stretched so its drawing (not its glow room) fills the box
        function fitPiece(name, box, flip = false) {
            const info = CREATOR_LAYOUT[name];
            const sprite = new PIXI.Sprite(creatorTextures[name]);
            sprite.anchor.set(0.5);
            sprite.scale.set(box.w / (info.w - 2 * CREATOR_PAD) * (flip ? -1 : 1), box.h / (info.h - 2 * CREATOR_PAD));
            sprite.position.set(box.x + box.w / 2, box.y + box.h / 2);
            return sprite;
        }

        function makeCharacter(look) {
            const character = new PIXI.Container();
            if (look.species === 'bear') {
                // The game's bear, as it always was (placed to match how it sat in the car)
                const bear = new PIXI.Sprite(creatorTextures.bear);
                bear.scale.set(4 / 3);
                bear.position.set(-400, -693);
                character.addChild(bear);
                return character;
            }
            const skinColor = CREATOR_LAYOUT.skinColors[look.skin];

            const body = new PIXI.Graphics();
            BODY_LINES.forEach(([x1, y1, x2, y2]) => body.moveTo(x1, y1).lineTo(x2, y2));
            body.stroke({ width: 28, color: 0x151515, cap: 'round', join: 'round' });
            character.addChild(body);

            if (look.pants) {
                const kind = look.pants.startsWith('pants-skirt') ? 'skirt' : 'pants';
                character.addChild(fitPiece(look.pants, CLOTHES_BOXES[kind]));
            }
            if (look.shirt) {
                character.addChild(fitPiece(look.shirt, CLOTHES_BOXES[look.shirt === 'shirt-dress' ? 'dress' : 'shirt']));
            }

            // The drawn head, with its skin tinted to the chosen colour
            const neck = { x: 1010, y: 1165 };
            for (const name of ['human-skin', 'human-face']) {
                const sprite = new PIXI.Sprite(creatorTextures[name]);
                sprite.position.set(CREATOR_LAYOUT[name].x - neck.x, CREATOR_LAYOUT[name].y - neck.y);
                if (name === 'human-skin') sprite.tint = skinColor;
                character.addChild(sprite);
            }

            if (look.hair) {
                const head = HUMAN_HEAD;
                const hair = new PIXI.Container();
                hair.position.set(head.x, head.y);
                hair.rotation = head.rotation;
                HAIR_BOXES[look.hair].forEach(b => {
                    const w = b.w * head.rx, h = b.h * head.ry;
                    hair.addChild(fitPiece(look.hair, { x: b.cx * head.rx - w / 2, y: b.cy * head.ry - h / 2, w, h }, b.flip));
                });
                character.addChild(hair);
            }
            return character;
        }

        const creatorScreen = new PIXI.Container();
        const creatorBackdrop = new PIXI.Graphics();
        const creatorArt = new PIXI.Container();
        creatorScreen.addChild(creatorBackdrop, creatorArt);
        creatorScreen.visible = false;
        app.stage.addChild(creatorScreen);
        creatorArt.addChild(new PIXI.Sprite(await PIXI.Assets.load('public/img/creator/background.jpg')));

        // The character stands where it was drawn
        const CREATOR_NECK = { x: 1010, y: 1165 };
        const creatorCharacter = new PIXI.Container();
        creatorCharacter.position.set(CREATOR_NECK.x, CREATOR_NECK.y);

        // The cursor points at one piece at a time; moving it never picks anything, A / Enter / a click does
        const creator = { cursor: 0, mode: 'explore' };
        const creatorItems = [];
        const CURSOR_COLOR = 0xff0022;

        function addCreatorItem(groupIndex, option, spriteName, texture, glowTexture, def, wiggle) {
            const item = new PIXI.Container();
            item.position.set(def.x + def.w / 2, def.y + def.h / 2);
            const glow = new PIXI.Sprite(glowTexture);
            glow.anchor.set(0.5);
            glow.alpha = 0;
            const sprite = new PIXI.Sprite(texture);
            sprite.anchor.set(0.5);
            item.addChild(glow, sprite);
            item.eventMode = 'static';
            item.cursor = 'pointer';
            item.hitArea = new PIXI.Rectangle(-def.w / 2, -def.h / 2, def.w, def.h);
            const index = creatorItems.length;
            item.on('pointerover', () => pointAt(index));
            item.on('pointerdown', (e) => {
                e.stopPropagation();
                if (!itemEnabled(index)) {
                    blip(220, 0.1, 'triangle');
                    return;
                }
                pointAt(index);
                creatorConfirm();
            });
            // A red marker ring around the piece the cursor is on
            const ring = new PIXI.Graphics()
                .roundRect(-def.w / 2 + 6, -def.h / 2 + 6, def.w - 12, def.h - 12, Math.min(def.w, def.h) / 3)
                .stroke({ width: 22, color: CURSOR_COLOR });
            ring.alpha = 0;
            item.addChildAt(ring, 0);
            creatorArt.addChild(item);
            creatorItems.push({ group: groupIndex, option, item, glow, ring, highlight: 0, pointed: 0, wiggle });
        }

        CREATOR_GROUPS.forEach((g, gi) => g.options.forEach(option => {
            if (g.id === 'species') {
                // The two little figures stay in the background (lines cross them), so they only glow
                const name = 'species-' + option;
                addCreatorItem(gi, option, name, creatorTextures[name], creatorTextures[name + '-glow'], CREATOR_LAYOUT[name], false);
            } else if (g.id === 'go') {
                // The Explore button from the main menu, in the empty corner
                const def = MENU_BUTTONS.find(b => b.id === 'explore');
                const scale = 0.5;
                addCreatorItem(gi, option, 'explore', menuItems.find(m => m.id === 'explore').texture, menuItems.find(m => m.id === 'explore').glowTexture,
                    { x: 1715, y: 1480, w: def.w * scale, h: def.h * scale }, true);
                [creatorItems.at(-1).glow, creatorItems.at(-1).item.children.at(-1)].forEach(c => c.scale.set(scale));
            } else {
                addCreatorItem(gi, option, option, creatorTextures[option], creatorTextures[option + '-glow'], CREATOR_LAYOUT[option], true);
            }
        }));
        creatorArt.addChild(creatorCharacter);

        function groupEnabled(index) {
            return !CREATOR_GROUPS[index].humanOnly || look.species === 'human';
        }

        function redrawCharacter() {
            creatorCharacter.removeChildren().forEach(c => c.destroy({ children: true }));
            creatorCharacter.addChild(makeCharacter(look));
        }

        function itemEnabled(index) {
            return groupEnabled(creatorItems[index].group);
        }

        function pointAt(index) {
            if (creator.cursor === index || !itemEnabled(index)) return;
            creator.cursor = index;
            blip(440 + creatorItems[index].group * 50, 0.04, 'triangle');
        }

        // Moves the cursor to the nearest piece in that direction, preferring ones straight ahead
        function moveCreatorCursor(dx, dy) {
            const from = creatorItems[creator.cursor].item.position;
            const length = Math.hypot(dx, dy);
            let best = null, bestScore = Infinity;
            creatorItems.forEach((c, i) => {
                if (i === creator.cursor || !itemEnabled(i)) return;
                const vx = c.item.position.x - from.x, vy = c.item.position.y - from.y;
                const ahead = (vx * dx + vy * dy) / length;
                if (ahead <= 20) return;
                const sideways = Math.abs(vx * dy - vy * dx) / length;
                const score = ahead + sideways * 2.5;
                if (score < bestScore) {
                    bestScore = score;
                    best = i;
                }
            });
            if (best !== null) pointAt(best);
        }

        // Picks the piece under the cursor. Picking what's already picked takes it off again (not for species or skin)
        function creatorConfirm() {
            const c = creatorItems[creator.cursor];
            if (!itemEnabled(creator.cursor)) {
                blip(220, 0.1, 'triangle');
                return;
            }
            if (c.option === 'go') {
                finishCreator();
                return;
            }
            const g = CREATOR_GROUPS[c.group];
            look[g.id] = look[g.id] === c.option && g.optional ? null : c.option;
            redrawCharacter();
            blip(520 + g.options.indexOf(c.option) * 60, 0.06);
        }

        // The creator's go button is the menu button for the mode you picked
        function openCreator(mode) {
            creator.mode = mode;
            const go = creatorItems.find(c => c.option === 'go');
            const button = menuItems.find(m => m.id === mode);
            go.glow.texture = button.glowTexture;
            go.item.children.at(-1).texture = button.texture;
            clearInput();
            look = loadLook();
            redrawCharacter();
            creator.cursor = creatorItems.findIndex(c => c.group === 0 && c.option === look.species);
            game.state = 'creator';
            updateScreens();
        }

        function finishCreator() {
            saveLook();
            dressBear();
            if (creator.mode === 'survival') startSurvival();
            else startExplore();
        }

        function updateCreator(now) {
            creatorItems.forEach((c, i) => {
                const g = CREATOR_GROUPS[c.group];
                const enabled = groupEnabled(c.group);
                c.item.alpha += ((enabled ? 1 : 0.2) - c.item.alpha) * 0.2;
                // Picked pieces glow orange; the one under the cursor gets a red ring and wiggles
                const chosen = enabled && g.id !== 'go' && look[g.id] === c.option;
                const pointed = i === creator.cursor;
                c.highlight += ((chosen ? 1 : 0) - c.highlight) * 0.2;
                c.pointed += ((pointed ? 1 : 0) - c.pointed) * 0.25;
                c.glow.alpha = Math.max(c.highlight, g.id === 'go' ? c.pointed : 0);
                c.ring.alpha = c.pointed * (0.85 + 0.15 * Math.sin(now / 150));
                const h = c.wiggle ? c.pointed : 0;
                c.item.scale.set(1 + h * (0.08 + 0.015 * Math.sin(now / 220)));
                c.item.rotation = h * 0.03 * Math.sin(now / 300);
            });
        }

        // A short message that pops up at the bottom of the screen and fades away
        const toast = new PIXI.Container();
        const toastBg = new PIXI.Graphics();
        const toastText = new PIXI.Text({ text: '', style: { fontFamily: 'Arial', fontSize: 34, fontWeight: 'bold', fill: 0x1a1a2e } });
        toastText.anchor.set(0.5);
        toast.addChild(toastBg, toastText);
        toast.visible = false;
        let toastUntil = 0;

        function showToast(message) {
            toastText.text = message;
            const w = toastText.width + 64, h = toastText.height + 32;
            toastBg.clear().roundRect(-w / 2, -h / 2, w, h, 18).fill(0xffe45c).stroke({ width: 5, color: 0x1a1a2e });
            toastUntil = performance.now() + 2200;
            toast.visible = true;
        }

        const PAUSE_OPTIONS = [
            { label: 'Keep Playing', action: () => resumeGame() },
            { label: 'Reset Bear', action: () => { resetScene(); resumeGame(); } },
            { label: 'Main Menu', action: () => showMainMenu() },
        ];
        const PAUSE_OPTION_W = 300, PAUSE_OPTION_H = 64, PAUSE_OPTION_GAP = 16;

        const pauseMenu = new PIXI.Container();
        const pauseShade = new PIXI.Graphics();
        pauseShade.eventMode = 'static';
        pauseShade.on('pointerdown', e => e.stopPropagation());
        const pausePanel = new PIXI.Container();
        pauseMenu.addChild(pauseShade, pausePanel);
        pauseMenu.visible = false;
        app.stage.addChild(pauseMenu, toast);

        const pausePanelH = 110 + PAUSE_OPTIONS.length * (PAUSE_OPTION_H + PAUSE_OPTION_GAP);
        pausePanel.addChild(new PIXI.Graphics()
            .roundRect(-PAUSE_OPTION_W / 2 - 40, -pausePanelH / 2, PAUSE_OPTION_W + 80, pausePanelH, 24).fill(0x1a1a2e)
            .roundRect(-PAUSE_OPTION_W / 2 - 40, -pausePanelH / 2, PAUSE_OPTION_W + 80, pausePanelH, 24).stroke({ width: 4, color: 0x487de7 }));
        const pauseTitle = new PIXI.Text({ text: 'Paused', style: { fontFamily: 'Arial', fontSize: 40, fontWeight: 'bold', fill: 0xffffff } });
        pauseTitle.anchor.set(0.5, 0);
        pauseTitle.position.y = -pausePanelH / 2 + 24;
        pausePanel.addChild(pauseTitle);

        const pause = { index: 0 };
        const pauseItems = PAUSE_OPTIONS.map((option, i) => {
            const item = new PIXI.Container();
            item.position.y = -pausePanelH / 2 + 100 + i * (PAUSE_OPTION_H + PAUSE_OPTION_GAP) + PAUSE_OPTION_H / 2;
            const bg = new PIXI.Graphics();
            const text = new PIXI.Text({ text: option.label, style: { fontFamily: 'Arial', fontSize: 28, fontWeight: 'bold', fill: 0xffffff } });
            text.anchor.set(0.5);
            item.addChild(bg, text);
            item.eventMode = 'static';
            item.cursor = 'pointer';
            item.on('pointerover', () => selectPauseItem(i));
            item.on('pointerdown', (e) => {
                e.stopPropagation();
                selectPauseItem(i);
                choosePauseItem();
            });
            pausePanel.addChild(item);
            return { item, bg, text, drawnSelected: null };
        });

        function selectPauseItem(index) {
            if (pause.index === index) return;
            pause.index = index;
            blip(500 + index * 80, 0.05);
        }

        function movePauseSelection(step) {
            selectPauseItem((pause.index + step + pauseItems.length) % pauseItems.length);
        }

        function choosePauseItem() {
            PAUSE_OPTIONS[pause.index].action();
        }

        function clearInput() {
            input = { xDirection: null, yDirection: null };
            gamepadXDirection = null;
            pointerDown = false;
        }

        function updateScreens() {
            mainMenu.visible = game.state === 'menu';
            creatorScreen.visible = game.state === 'creator';
            pixiParent.visible = hud.visible = game.state === 'playing' || game.state === 'paused';
            pauseMenu.visible = game.state === 'paused';
            const survivalMode = game.mode === 'survival';
            backgroundLayer.visible = decorLayer.visible = blockLayer.visible = !survivalMode;
            survivalLayer.visible = sparkleLayer.visible = survivalMode;
            for (const id of ['edit', 'spawn', 'clear']) buttons[id].visible = !survivalMode;
            buttons.reset.setLabel(survivalMode ? 'Restart Level (R)' : 'Reset Bear (R)');
            pauseItems[1].text.text = survivalMode ? 'Restart Level' : 'Reset Bear';
            layoutHud();
        }

        function startExplore() {
            if (!playedInitialAudio) playInitialAudio();
            clearInput();
            game.mode = 'explore';
            level = EXPLORE_LEVEL;
            resetScene();
            game.state = 'playing';
            updateScreens();
            updateCamera(true);
        }

        function startSurvival() {
            clearInput();
            setEditMode(false);
            game.mode = 'survival';
            level = SURVIVAL_LEVEL;
            resetScene();
            game.state = 'playing';
            updateScreens();
        }

        function showMainMenu() {
            setEditMode(false);
            saveBuild();
            clearInput();
            game.state = 'menu';
            updateScreens();
        }

        function pauseGame() {
            if (game.state !== 'playing') return;
            clearInput();
            if (editor.dragging && editor.held) dropHeld();
            pause.index = 0;
            game.state = 'paused';
            updateScreens();
            blip(390, 0.08, 'triangle');
        }

        function resumeGame() {
            clearInput();
            game.state = 'playing';
            updateScreens();
        }

        function layoutMenus() {
            const { width, height } = app.screen;
            // The drawing has a white background, so white bars fill any leftover space around it
            mainMenuBackdrop.clear().rect(0, 0, width, height).fill(0xffffff);
            const scale = Math.min(width / MENU_ART.w, height / MENU_ART.h);
            mainMenuArt.scale.set(scale);
            mainMenuArt.position.set((width - MENU_ART.w * scale) / 2, (height - MENU_ART.h * scale) / 2);
            creatorBackdrop.clear().rect(0, 0, width, height).fill(0xffffff);
            creatorArt.scale.set(scale);
            creatorArt.position.copyFrom(mainMenuArt.position);
            pauseShade.clear().rect(0, 0, width, height).fill({ color: 0x000000, alpha: 0.5 });
            pausePanel.scale.set(Math.min(1.4, Math.max(0.7, height / VIEW_HEIGHT)));
            pausePanel.position.set(width / 2, height / 2);
            toast.scale.set(Math.min(1.4, Math.max(0.6, height / VIEW_HEIGHT)));
            toast.position.set(width / 2, height - 80 * toast.scale.y);
        }
        app.renderer.on('resize', layoutMenus);
        layoutMenus();
        updateScreens();

        function updateMenus(now) {
            if (game.state === 'creator') updateCreator(now);
            if (game.state === 'menu') {
                // The selected button grows, wiggles a little and glows
                menuItems.forEach((m, i) => {
                    m.highlight += ((i === menu.index ? 1 : 0) - m.highlight) * 0.2;
                    const h = m.highlight;
                    m.glow.alpha = h * (0.8 + 0.2 * Math.sin(now / 180));
                    m.item.scale.set(1 + h * (0.08 + 0.015 * Math.sin(now / 220)));
                    m.item.rotation = h * 0.02 * Math.sin(now / 300);
                });
            }
            if (game.state === 'paused') {
                pauseItems.forEach((p, i) => {
                    const selected = i === pause.index;
                    if (p.drawnSelected !== selected) {
                        p.bg.clear().roundRect(-PAUSE_OPTION_W / 2, -PAUSE_OPTION_H / 2, PAUSE_OPTION_W, PAUSE_OPTION_H, 14)
                            .fill(selected ? 0xffe45c : 0x0f3460);
                        p.bg.roundRect(-PAUSE_OPTION_W / 2, -PAUSE_OPTION_H / 2, PAUSE_OPTION_W, PAUSE_OPTION_H, 14)
                            .stroke({ width: 3, color: selected ? 0xffffff : 0x487de7 });
                        p.text.style.fill = selected ? 0x1a1a2e : 0xffffff;
                        p.drawnSelected = selected;
                    }
                    const target = selected ? 1.06 + 0.02 * Math.sin(now / 200) : 1;
                    p.item.scale.set(p.item.scale.x + (target - p.item.scale.x) * 0.25);
                });
            }
            if (toast.visible) {
                const left = toastUntil - now;
                toast.alpha = Math.min(1, left / 400);
                if (left <= 0) toast.visible = false;
            }
        }

        // ---------- Saving what you built ----------

        function saveBuild() {
            try {
                const data = blocks.filter(b => b.tile !== LETTER_TILE).map(b => {
                    const c = blockCenter(b);
                    return { t: b.tile.id, x: Math.round(c.x), y: Math.round(c.y), r: nearestQuarterTurn(b.body.angle), p: b.pinned };
                });
                localStorage.setItem(SAVE_KEY, JSON.stringify(data));
            } catch (e) { }
        }

        function loadBuild() {
            try {
                const data = JSON.parse(localStorage.getItem(SAVE_KEY) || '[]');
                data.forEach(({ t, x, y, r, p }) => {
                    const tile = TILE_BY_ID[t];
                    if (tile) addBlock(tile, { x, y }, r, p);
                });
            } catch (e) { }
        }

        // ---------- Scene ----------

        function initScene() {
            drawLevel();
            loadBuild();
            addCar();
            updateCamera(true);
        }

        // Puts the bear back at the start and clears spawned letters; your build stays
        function resetScene() {
            input = { xDirection: null, yDirection: null }
            editor.held = null;
            blocks.filter(b => b.tile === LETTER_TILE).forEach(removeBlock);
            currentLetterIndex = 0;
            if (game.mode === 'survival') restartSurvival();
            else spawnCar();
        }

        function toggleDebug() {
            debugMode = !debugMode;
            buttons.debug.setActive(debugMode);
        }

        app.ticker.add(() => {
            const now = performance.now();
            pollGamepads(now);
            updateMenus(now);
            if (game.state === 'menu' || game.state === 'creator') return;

            const playing = game.state === 'playing' && !editor.active;
            if (playing) {
                // In survival the bear can't drive once it's been hit or has won, and everything stops while it's hurt
                const canDrive = game.mode !== 'survival' || survival.state === 'running';
                const xDirection = input.xDirection ?? gamepadXDirection;
                if (canDrive && (xDirection !== null || input.yDirection !== null)) {
                    moveCar(xDirection, input.yDirection)
                }
                if (game.mode !== 'survival' || survival.state !== 'hurt') {
                    Engine.update(engine, 1000 / 60);
                    limitCar();
                }
            }

            blocks.forEach(block => {
                block.sprite.x = block.body.position.x;
                block.sprite.y = block.body.position.y;
                block.sprite.rotation = block.body.angle;
            });
            renderCar();
            if (playing && game.mode === 'survival') updateSurvival(now);
            updateCamera();
            drawEditorOverlay(now);
            updateHud();
            drawDebug();
        });

        function renderCar() {
            carContainer.position.x = car.base.position.x;
            carContainer.position.y = car.base.position.y;
            carContainer.rotation = car.chassis.angle;
            wheelSprites.forEach((sprite, i) => {
                sprite.position.set(car.wheels[i].position.x, car.wheels[i].position.y);
                sprite.rotation = car.wheels[i].angle;
            });
        }

        function playAudio(name) {
            const clip = new Audio(`public/audio/${name}.wav`);
            clip.play();
        }

        function playInitialAudio() {
            playAudio('howdoigetoutofhere');
            playedInitialAudio = true;
        }

        let audioContext = null;
        function blip(frequency, duration, type = 'square') {
            try {
                audioContext ??= new AudioContext();
                const t = audioContext.currentTime;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(frequency, t);
                osc.frequency.exponentialRampToValueAtTime(frequency * 1.5, t + duration);
                gain.gain.setValueAtTime(0.06, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                osc.connect(gain).connect(audioContext.destination);
                osc.start(t);
                osc.stop(t + duration);
            } catch (e) { }
        }

        // Standard gamepad layout (Steam Deck, Xbox, PlayStation, Switch Pro)
        const GAMEPAD_BUTTON = { A: 0, B: 1, X: 2, Y: 3, LB: 4, RB: 5, LT: 6, RT: 7, SELECT: 8, START: 9, DPAD_UP: 12, DPAD_DOWN: 13, DPAD_LEFT: 14, DPAD_RIGHT: 15 };
        const STICK_DEADZONE = 0.3;
        const CURSOR_REPEAT_DELAY = 300;
        const CURSOR_REPEAT_RATE = 90;
        let cursorRepeat = { key: null, next: 0 };

        // True once when a direction is first pushed, then again every so often while it's held
        function repeatedMove(dx, dy, now) {
            const key = dx || dy ? dx + ',' + dy : null;
            if (!key) {
                cursorRepeat.key = null;
                return false;
            }
            if (key !== cursorRepeat.key) {
                cursorRepeat = { key, next: now + CURSOR_REPEAT_DELAY };
                return true;
            }
            if (now >= cursorRepeat.next) {
                cursorRepeat.next = now + CURSOR_REPEAT_RATE;
                return true;
            }
            return false;
        }

        function pollGamepads(now) {
            const pads = navigator.getGamepads ? navigator.getGamepads() : [];
            let dx = 0, dy = 0;
            const pressed = [];
            for (const pad of pads) {
                if (!pad) continue;
                pad.buttons.forEach((button, i) => { if (button.pressed) pressed[i] = true; });
                const stickX = pad.axes[0] ?? 0;
                const stickY = pad.axes[1] ?? 0;
                if (pad.buttons[GAMEPAD_BUTTON.DPAD_LEFT]?.pressed || stickX < -STICK_DEADZONE) dx = -1;
                if (pad.buttons[GAMEPAD_BUTTON.DPAD_RIGHT]?.pressed || stickX > STICK_DEADZONE) dx = 1;
                if (pad.buttons[GAMEPAD_BUTTON.DPAD_UP]?.pressed || stickY < -STICK_DEADZONE) dy = -1;
                if (pad.buttons[GAMEPAD_BUTTON.DPAD_DOWN]?.pressed || stickY > STICK_DEADZONE) dy = 1;
            }

            const previous = previousGamepadButtons;
            const justPressed = (i) => pressed[i] && !previous[i];
            previousGamepadButtons = pressed;

            if (game.state === 'menu') {
                if (repeatedMove(0, dy, now)) moveMenuSelection(dy);
                if (justPressed(GAMEPAD_BUTTON.A) || justPressed(GAMEPAD_BUTTON.START)) chooseMenuItem();
                return;
            }
            if (game.state === 'creator') {
                if (repeatedMove(dx, dy, now)) moveCreatorCursor(dx, dy);
                if (justPressed(GAMEPAD_BUTTON.A)) creatorConfirm();
                else if (justPressed(GAMEPAD_BUTTON.START)) finishCreator();
                else if (justPressed(GAMEPAD_BUTTON.B)) showMainMenu();
                return;
            }
            if (game.state === 'paused') {
                if (repeatedMove(0, dy, now)) movePauseSelection(dy);
                if (justPressed(GAMEPAD_BUTTON.A)) choosePauseItem();
                else if (justPressed(GAMEPAD_BUTTON.B) || justPressed(GAMEPAD_BUTTON.START)) resumeGame();
                return;
            }

            if (justPressed(GAMEPAD_BUTTON.START)) {
                pauseGame();
                return;
            }
            if (justPressed(GAMEPAD_BUTTON.Y)) toggleEditMode();
            if (justPressed(GAMEPAD_BUTTON.SELECT)) toggleDebug();

            if (editor.active) {
                gamepadXDirection = null;
                // Move the cursor one square per press, repeating while held
                if (repeatedMove(dx, dy, now)) moveCursor(dx, dy);
                if (justPressed(GAMEPAD_BUTTON.A)) editPrimary();
                if (justPressed(GAMEPAD_BUTTON.B)) editDelete();
                if (justPressed(GAMEPAD_BUTTON.X)) editGrab();
                if (justPressed(GAMEPAD_BUTTON.LT)) editRotate();
                if (justPressed(GAMEPAD_BUTTON.LB)) cycleTile(-1);
                if (justPressed(GAMEPAD_BUTTON.RB)) cycleTile(1);
                if (justPressed(GAMEPAD_BUTTON.RT)) editTogglePin();
            } else {
                gamepadXDirection = dx < 0 ? "left" : dx > 0 ? "right" : null;
                if (justPressed(GAMEPAD_BUTTON.A) || justPressed(GAMEPAD_BUTTON.DPAD_UP)) jump();
                if (justPressed(GAMEPAD_BUTTON.X)) spawnRandomObject();
            }
        }

        async function onPointerEvent(e) {
            if (game.state !== 'playing') return;
            if (editor.active) {
                // Moving over the button bar or the parts bar shouldn't drag the cursor along
                const overHud = e.global.y < TOP_BAR_HEIGHT || e.global.y > app.screen.height - HUD_PANEL_HEIGHT;
                if (overHud && !editor.dragging) return;
                setCursorFromWorld(e.getLocalPosition(pixiParent));
                return;
            }
            if (pointerDown) {
                const pos = e.getLocalPosition(app.stage)
                const xDirection = pos.x > app.screen.width / 2 ? "right" : "left"
                const yDirection = pos.y < app.screen.height / 2 ? "up" : "down"
                input = { xDirection, yDirection }
            }
        }

        function onPointerUp() {
            pointerDown = false
            if (editor.active) {
                if (editor.dragging && editor.held) dropHeld();
                editor.dragging = false;
                return;
            }
            input = { xDirection: null, yDirection: null }
        }

        app.stage.eventMode = 'static'
        app.stage.hitArea = app.screen
        app.stage.on('pointerdown', async (e) => {
            if (game.state !== 'playing') return;
            if (editor.active) {
                setCursorFromWorld(e.getLocalPosition(pixiParent));
                if (e.button === 2) {
                    editDelete();
                    return;
                }
                if (editor.held) {
                    dropHeld();
                    return;
                }
                // Drag solid blocks around, click anywhere else to place
                const block = solidBlockAt(cursorPoint()) ?? (e.shiftKey ? blockAt(cursorPoint()) : null);
                if (block) {
                    grab(block);
                    editor.dragging = true;
                } else {
                    placeSelected();
                }
                return;
            }
            pointerDown = true
        })
        app.stage.on('pointerup', onPointerUp)
        app.stage.on('pointerupoutside', onPointerUp)
        app.stage.on('pointermove', onPointerEvent)
        app.canvas.addEventListener('contextmenu', e => e.preventDefault());
        app.canvas.addEventListener('wheel', (e) => {
            if (game.state !== 'playing' || !editor.active) return;
            e.preventDefault();
            cycleTile(e.deltaY > 0 ? 1 : -1);
        }, { passive: false });

        document.addEventListener('keydown', (e) => {
            const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
            if (key === 'f' && !e.repeat) {
                toggleFullscreen();
                return;
            }
            if (game.state === 'creator') {
                const moves = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
                if (moves[key]) {
                    e.preventDefault();
                    moveCreatorCursor(...moves[key]);
                } else if ((key === ' ' || key === 'Enter') && !e.repeat) {
                    e.preventDefault();
                    creatorConfirm();
                } else if (key === 'Escape' && !e.repeat) {
                    showMainMenu();
                }
                return;
            }
            if (game.state !== 'playing') {
                const choose = game.state === 'menu' ? chooseMenuItem : choosePauseItem;
                const move = game.state === 'menu' ? moveMenuSelection : movePauseSelection;
                if (key === 'ArrowUp' || key === 'ArrowDown') {
                    e.preventDefault();
                    move(key === 'ArrowUp' ? -1 : 1);
                } else if ((key === ' ' || key === 'Enter') && !e.repeat) {
                    e.preventDefault();
                    choose();
                } else if (key === 'Escape' && game.state === 'paused' && !e.repeat) {
                    resumeGame();
                }
                return;
            }
            if (key === 'Escape' && !e.repeat) {
                pauseGame();
            } else if (key === 'e' && !e.repeat) {
                toggleEditMode();
            } else if (key === 'd' && !e.repeat) {
                toggleDebug();
            } else if (key === 'r' && !e.repeat) {
                resetScene();
            } else if (editor.active) {
                const moves = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
                if (moves[key]) {
                    e.preventDefault();
                    moveCursor(...moves[key]);
                } else if ((key === ' ' || key === 'Enter') && !e.repeat) {
                    e.preventDefault();
                    editPrimary();
                } else if ((key === 'x' || key === 'Delete' || key === 'Backspace') && !e.repeat) {
                    editDelete();
                } else if (key === 'g' && !e.repeat) {
                    editGrab();
                } else if (key === 'z' && !e.repeat) {
                    editRotate();
                } else if (key === 'q') {
                    cycleTile(-1);
                } else if (key === 'w') {
                    cycleTile(1);
                } else if (key === 'p' && !e.repeat) {
                    editTogglePin();
                }
            } else if (key === ' ') {
                e.preventDefault();
                if (game.mode === 'survival') jump();
                else spawnRandomObject();
            } else if (key === 'ArrowRight') {
                input.xDirection = "right"
            } else if (key === 'ArrowLeft') {
                input.xDirection = "left"
            } else if (key === 'ArrowUp') {
                jump();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowRight') {
                input.xDirection = null
            } else if (e.key === 'ArrowLeft') {
                input.xDirection = null
            }
        });

        // Save now and then too, so blocks that fell over during play are remembered
        setInterval(() => { if (!editor.held) saveBuild(); }, 5000);
        window.addEventListener('beforeunload', saveBuild);

        initScene();

        // Handy for poking at the game from the browser console
        window.bearGame = { app, game, survival, enemies, startSurvival, restartSurvival, burstSparkles, get level() { return level; }, menu, startExplore, openCreator, finishCreator, get look() { return look; }, creator, creatorItems, creatorConfirm, moveCreatorCursor, pointAt, showMainMenu, pauseGame, resumeGame, engine, buttons, blocks, editor, get car() { return car; }, setEditMode, editPrimary, editGrab, editDelete, editRotate, editTogglePin, moveCursor, setCursor, cycleTile, selectTile, resolveBearOverlap, carHitsBlocks, jump, TILES };
    </script>
</body>
